# Endereço público neutro do site (ver public/_worker.js).
# Publicar: npx wrangler pages deploy public --project-name eventos-goias --branch main
name = "eventos-goias"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[services]]
binding = "ATUALIZADOR"
service = "eventos-goias-atualizar"
